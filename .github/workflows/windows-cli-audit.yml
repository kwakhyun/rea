name: Windows CLI timeout diagnosis
on:
  push:
    branches: [codex/diagnose-windows-cli-timeout]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Windows CLI (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: patched
            repository: kwakhyun/rea
            revision: ff9cba6fe7ae048bfe800eb23caa6d6f0b395df0
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: npm install --global npm@11.16.0
      - run: npm ci
        working-directory: target
      - name: Restore the exact native artifact from the failing upstream run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: morluto/rea
          run-id: 39300547385
          artifact-ids: 12211163524
          merge-multiple: true
          github-token: ${{ github.token }}
          path: target/native/windows/build
      - run: npm run verify:windows-native:artifact
        working-directory: target
      - run: npm run build:cached
        working-directory: target
      - name: Verify CLI parity and existing cache behavior on the committed patch
        working-directory: target
        run: >-
          node scripts/run-exact-tests.mjs run
          tests/acceptance/webModuleCli.test.ts
          tests/acceptance/webSourceLocationCli.test.ts
          tests/boundary/cli/cliCompileCache.test.ts
          --maxWorkers=1 --no-file-parallelism
      - name: Run the full curated Windows test selection
        if: ${{ !cancelled() }}
        run: node audit/run-curated-windows.mjs target
